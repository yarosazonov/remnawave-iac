---
- name: Wait for Connectivity
  hosts: remnawave_panel
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        delay: 0
        timeout: 180
        connect_timeout: 2
        sleep: 1

- name: Deploy Remnawave Panel
  hosts: remnawave_panel
  become: true

  vars_files:
    - "../../config/panel.yaml"
  
  # To avoid collisons with panel.yaml vars
  pre_tasks:
    - name: Load Bot Config
      include_vars:
        file: "../../config/bot.yaml"
        name: bot_config

  vars:
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
    # List of users to add to the docker group
    docker_users:
      - "{{ ansible_user }}"
      - "{{ server.admin.username }}"

    # Derived variables
    panel_domain: "{{ domain.panel_subdomain }}.{{ domain.zone }}"
    panel_url: "https://{{ panel_domain }}"
    subpage_domain: "{{ domain.sub_subdomain }}.{{ domain.zone }}"

  roles:
    # Default ufw setup (incoming/outgoing + ssh).
    # 80 and 443 are managed by docker using iptables
    # though ufw were blocking the internal bot - panel traffic, so open it anyway
    - role: ufw
      vars:
        ufw_open_ports: [80, 443]
    - docker
    - remna_panel/setup
    - remna_panel/caddy
    - remna_panel/creds
    - role: remna_panel/subpage
      when: domain.sub_subdomain | default('') | length > 0
    - reboot
